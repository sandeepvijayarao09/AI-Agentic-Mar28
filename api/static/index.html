<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Second Brain</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #ededed; height: 100vh; display: flex; flex-direction: column; }
header { border-bottom: 1px solid #222; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #3b82f6); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; }
.logo h1 { font-size: 20px; font-weight: 700; }
.logo p { font-size: 11px; color: #888; }
.btns { display: flex; gap: 8px; }
.btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; transition: background 0.2s; }
.btn-blue { background: #2563eb; color: white; }
.btn-blue:hover { background: #1d4ed8; }
.btn-gray { background: #333; color: white; }
.btn-gray:hover { background: #444; }
.messages { flex: 1; overflow-y: auto; padding: 24px; }
.messages-inner { max-width: 720px; margin: 0 auto; }
.welcome { text-align: center; margin-top: 60px; }
.welcome .emoji { font-size: 64px; margin-bottom: 16px; }
.welcome h2 { font-size: 24px; color: #ddd; margin-bottom: 8px; }
.welcome p { color: #666; margin-bottom: 24px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.suggestion { padding: 8px 16px; border-radius: 20px; background: #1a1a1a; border: 1px solid #333; color: #bbb; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.suggestion:hover { background: #222; border-color: #555; }
.msg { margin-bottom: 16px; display: flex; }
.msg-user { justify-content: flex-end; }
.msg-assistant { justify-content: flex-start; }
.msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
.msg-user .msg-bubble { background: #2563eb; color: white; }
.msg-assistant .msg-bubble { background: #1a1a1a; color: #e5e5e5; }
.msg-bubble a { color: #60a5fa; text-decoration: underline; }
.msg-bubble strong { font-weight: 600; }
.msg-bubble img { max-width: 200px; border-radius: 8px; margin-top: 8px; }
.typing { display: flex; gap: 4px; padding: 12px 16px; }
.typing span { width: 8px; height: 8px; background: #555; border-radius: 50%; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
.input-area { border-top: 1px solid #222; padding: 16px; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
.input-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
#input { flex: 1; background: #1a1a1a; color: white; border: 1px solid #333; padding: 12px 16px; border-radius: 12px; font-size: 14px; outline: none; }
#input:focus { border-color: #2563eb; }
#input::placeholder { color: #555; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.2s; }
.icon-btn:hover { transform: scale(1.05); }
#send { background: #2563eb; color: white; font-size: 16px; }
#send:hover { background: #1d4ed8; }
#send:disabled { background: #333; cursor: not-allowed; }
#mic { background: #333; color: #ccc; }
#mic.recording { background: #ef4444; color: white; animation: pulse 1s infinite; }
#img-btn { background: #333; color: #ccc; }
#img-btn:hover { background: #444; }
#img-input { display: none; }
#speaker { background: #333; color: #ccc; }
#speaker.active { background: #8b5cf6; color: white; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.img-preview { max-width: 720px; margin: 8px auto; display: none; align-items: center; gap: 8px; padding: 8px; background: #1a1a1a; border-radius: 12px; }
.img-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
.img-preview .info { flex: 1; color: #aaa; font-size: 13px; }
.img-preview .remove { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">SB</div>
    <div>
      <h1>Agentic Second Brain</h1>
      <p>Railtracks + Gemini + DigitalOcean | Voice + Vision + Shopping</p>
    </div>
  </div>
  <div class="btns">
    <button class="btn btn-gray" onclick="checkStatus()">Status</button>
    <button class="btn btn-blue" onclick="syncGmail()">Sync Gmail</button>
  </div>
</header>

<div class="messages" id="messages">
  <div class="messages-inner" id="messages-inner">
    <div class="welcome" id="welcome">
      <div class="emoji">🧠</div>
      <h2>Your Agentic Second Brain</h2>
      <p>Chat, speak, or snap a photo — I'll shop for you autonomously.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion(this)">What are my favourite restaurants?</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Order me pizza from DoorDash</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Buy me headphones on Amazon</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Sync my emails</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Update my bio — I'm Sandeep from Boston</button>
      </div>
    </div>
  </div>
</div>

<!-- Image preview bar -->
<div class="img-preview" id="img-preview">
  <img id="img-thumb" src="">
  <div class="info" id="img-info">Image attached</div>
  <button class="remove" onclick="clearImage()">&times;</button>
</div>

<div class="input-area">
  <div class="input-inner">
    <button class="icon-btn" id="img-btn" onclick="document.getElementById('img-input').click()" title="Upload image to identify & shop">📷</button>
    <input type="file" id="img-input" accept="image/*" onchange="handleImage(this)">
    <button class="icon-btn" id="mic" onclick="toggleMic()" title="Voice input">🎤</button>
    <input id="input" placeholder="Chat, speak, or upload a photo..." onkeydown="if(event.key==='Enter')send()">
    <button class="icon-btn" id="speaker" onclick="toggleSpeaker()" title="Toggle voice output">🔊</button>
    <button class="icon-btn" id="send" onclick="send()">➤</button>
  </div>
</div>

<script>
const messagesInner = document.getElementById('messages-inner');
const messagesDiv = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const welcome = document.getElementById('welcome');
let loading = false;
let pendingImage = null;
let voiceOutputEnabled = false;
let recognition = null;
let isRecording = false;

// ── Voice Input (Web Speech API) ──
function toggleMic() {
  const micBtn = document.getElementById('mic');
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('Voice input not supported in this browser. Use Chrome.');
    return;
  }
  if (isRecording) {
    recognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onstart = () => { isRecording = true; micBtn.classList.add('recording'); };
  recognition.onend = () => { isRecording = false; micBtn.classList.remove('recording'); };
  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    input.value = transcript;
    if (e.results[0].isFinal) { recognition.stop(); send(); }
  };
  recognition.onerror = () => { isRecording = false; micBtn.classList.remove('recording'); };
  recognition.start();
}

// ── Voice Output (TTS) ──
function toggleSpeaker() {
  voiceOutputEnabled = !voiceOutputEnabled;
  document.getElementById('speaker').classList.toggle('active', voiceOutputEnabled);
}

function speak(text) {
  if (!voiceOutputEnabled || !('speechSynthesis' in window)) return;
  const clean = text.replace(/\*\*/g, '').replace(/\[(.+?)\]\(.+?\)/g, '$1').replace(/<[^>]+>/g, '');
  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.rate = 1.1;
  utterance.pitch = 1;
  speechSynthesis.speak(utterance);
}

// ── Image Upload ──
function handleImage(el) {
  const file = el.files[0];
  if (!file) return;
  pendingImage = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('img-thumb').src = e.target.result;
    document.getElementById('img-info').textContent = file.name + ' — will identify & shop';
    document.getElementById('img-preview').style.display = 'flex';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  pendingImage = null;
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('img-input').value = '';
}

// ── Send Message ──
function sendSuggestion(el) { input.value = el.textContent; send(); }

async function send() {
  const text = input.value.trim();
  if ((!text && !pendingImage) || loading) return;
  if (welcome) welcome.remove();

  // If there's an image, handle vision flow
  if (pendingImage) {
    addMessage('user', (text || 'Find this on Amazon') + '<br><img src="' + document.getElementById('img-thumb').src + '">');
    input.value = '';
    loading = true;
    sendBtn.disabled = true;
    const typingEl = addTyping();

    try {
      const formData = new FormData();
      formData.append('file', pendingImage);
      const res = await fetch('/identify', { method: 'POST', body: formData });
      const data = await res.json();
      typingEl.remove();

      const msg = '**Identified:** ' + data.identified_product + '\n\nSearching Amazon and adding to cart...\n\n[Search on Amazon](' + data.amazon_search_url + ')';
      addMessage('assistant', msg);
      speak('I identified ' + data.identified_product + '. Let me add it to your Amazon cart.');

      // Trigger autonomous shopping
      const shopRes = await fetch('/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message: 'Buy me ' + data.identified_product + ' on Amazon', history: []}) });
      const shopData = await shopRes.json();
      addMessage('assistant', shopData.response);
      speak(shopData.response);
    } catch(e) {
      typingEl.remove();
      addMessage('assistant', 'Error processing image.');
    }
    clearImage();
    loading = false;
    sendBtn.disabled = false;
    return;
  }

  // Regular text message
  addMessage('user', text);
  input.value = '';
  loading = true;
  sendBtn.disabled = true;
  const typingEl = addTyping();
  try {
    const res = await fetch('/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message: text, history: []}) });
    const data = await res.json();
    typingEl.remove();
    const response = data.response || data.detail || 'Something went wrong.';
    addMessage('assistant', response);
    speak(response);
  } catch(e) {
    typingEl.remove();
    addMessage('assistant', 'Error connecting to backend.');
  }
  loading = false;
  sendBtn.disabled = false;
  input.focus();
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = content
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/`([^`]+)`/g, '<code style="background:#333;padding:2px 6px;border-radius:4px">$1</code>')
    .replace(/\n/g, '<br>');
  div.appendChild(bubble);
  messagesInner.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg msg-assistant';
  div.innerHTML = '<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  messagesInner.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return div;
}

async function syncGmail() {
  try {
    const res = await fetch('/sync/gmail', {method:'POST'});
    const data = await res.json();
    alert('Synced! Food: '+(data.food_synced||0)+', Shopping: '+(data.shopping_synced||0));
  } catch(e) { alert('Sync failed — connect Gmail first'); }
}

async function checkStatus() {
  try {
    const res = await fetch('/auth/gmail/status');
    const data = await res.json();
    if (data.authenticated) {
      const stats = await fetch('/sync/stats').then(r=>r.json());
      alert('Gmail: Connected\nFood Orders: '+stats.food_orders+'\nShopping: '+stats.shopping_orders+'\nFavourites: '+stats.favourites);
    } else {
      if (confirm('Gmail not connected. Connect now?')) window.location.href = '/auth/gmail/authorize';
    }
  } catch(e) { alert('Backend not reachable'); }
}
</script>
</body>
</html>
